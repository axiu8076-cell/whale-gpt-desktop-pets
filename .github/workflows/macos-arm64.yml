name: Build and verify Whale for Apple Silicon
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whale-macos-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign locally and run real arm64 smoke checks
        run: python3 tools/build-macos.py --output dist-macos
      - name: Upload verified package to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2026.10.16.2 --draft --target "$GITHUB_SHA" --title "鲸鲸 · M 芯片 Mac 独立版" --notes-file installer/macos/RELEASE.md
          gh release upload v2026.10.16.2 dist-macos/Whale-Standalone-macOS-arm64-2026.10.16.zip dist-macos/SHA256SUMS-macOS-arm64.txt dist-macos/macos-validation.json
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-validation
          path: dist-macos/macos-validation.json
          if-no-files-found: ignore
